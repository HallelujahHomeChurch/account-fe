server {
  listen 10000;
  server_name _;
  root /usr/share/nginx/html;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"healthy"}';
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy-Report-Only "default-src 'none'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; script-src-attr 'none'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://lh3.googleusercontent.com https://profile.line-scdn.net https://ui-avatars.com; font-src 'self'; connect-src 'self'__SENTRY_CONNECT_ORIGIN__; worker-src 'self' blob:; manifest-src 'self'; frame-src https://challenges.cloudflare.com; media-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /csp-report" always;
  }
}
