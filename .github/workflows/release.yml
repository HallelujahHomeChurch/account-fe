name: Production Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-account-fe-production
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: account-fe-production
  cancel-in-progress: false

jobs:
  agent_docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test documentation classification
        run: python3 .github/scripts/test-ci-agent-docs.py
      - name: Classify proven human documentation
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/ci-agent-docs.py "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  verify:
    needs: agent_docs
    if: ${{ needs.agent_docs.result == 'success' && needs.agent_docs.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan dependencies
        run: |
          trivy_cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$trivy_cache"
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$trivy_cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs /workspace/.git --skip-dirs /workspace/node_modules /workspace
      - run: |
          corepack pnpm test:run
          corepack pnpm lint
          corepack pnpm build
          ./scripts/test-release-policy.sh
          az bicep build --file infra/main.bicep --stdout >/dev/null

  deploy:
    needs: verify
    outputs:
      sourcemaps: ${{ steps.build.outputs.sourcemaps }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      RESOURCE_GROUP: alive
      STORAGE_ACCOUNT: hhcaccountfeprod
      STORAGE_CONTAINER: site
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RELEASE_CONFIRMATION: ${{ github.event_name == 'push' && 'deploy-account-fe-production' || inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release configuration
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$RELEASE_CONFIRMATION" == "deploy-account-fe-production" ]]
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            test -n "${!name:-}" || { echo "Missing repository variable: ${name}" >&2; exit 1; }
          done
      - name: Sign in to Azure with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Preview static hosting infrastructure
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters provisionPermissions=false \
            --validation-level Provider \
            --result-format ResourceIdOnly \
            --only-show-errors
      - name: Provision static hosting
        run: |
          az deployment group create \
            --name "account-fe-static-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters provisionPermissions=false \
            --only-show-errors --output none
      - name: Build production site
        id: build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_BUILD_SOURCEMAPS: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' && 'true' || 'false' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: |
          corepack pnpm build
          if [[ "$SENTRY_BUILD_SOURCEMAPS" == true ]]; then
            corepack pnpm exec sentry-cli sourcemaps inject dist
            [[ "$(az acr show -n alive --query anonymousPullEnabled -o tsv --only-show-errors)" == false ]] || exit 1
            az acr login --name alive
            maps_repository="alive/account-fe-sourcemaps"
            maps_tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            maps_ref="alive.azurecr.io/${maps_repository}:${maps_tag}"
            docker build -f Dockerfile.sourcemaps --build-arg BUILD_COMMIT="$GITHUB_SHA" -t "$maps_ref" dist
            docker push "$maps_ref"
            digest="$(az acr repository show -n alive --image "${maps_repository}:${maps_tag}" --query digest -o tsv --only-show-errors)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            echo "sourcemaps=alive.azurecr.io/${maps_repository}@${digest}" >> "$GITHUB_OUTPUT"
          fi
          find dist -type f -name '*.map' -delete
          test -z "$(find dist -type f -name '*.map' -print -quit)"
      - name: Capture current index
        run: |
          if az storage blob exists \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$STORAGE_CONTAINER" \
            --name index.html \
            --auth-mode login \
            --query exists -o tsv | grep -qx true; then
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$STORAGE_CONTAINER" \
              --name index.html \
              --file "$RUNNER_TEMP/previous-index.html" \
              --auth-mode login \
              --only-show-errors --output none
            echo "PREVIOUS_INDEX_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "PREVIOUS_INDEX_EXISTS=false" >> "$GITHUB_ENV"
          fi
      - name: Publish immutable assets then index
        id: publish
        run: |
          mv dist/index.html "$RUNNER_TEMP/index.html"
          az storage blob upload-batch \
            --account-name "$STORAGE_ACCOUNT" \
            --destination "$STORAGE_CONTAINER" \
            --source dist \
            --overwrite true \
            --content-cache-control "no-cache, no-store, must-revalidate" \
            --auth-mode login \
            --no-progress \
            --only-show-errors --output none
          if [[ -d dist/assets ]]; then
            az storage blob upload-batch \
              --account-name "$STORAGE_ACCOUNT" \
              --destination "$STORAGE_CONTAINER" \
              --destination-path assets \
              --source dist/assets \
              --overwrite true \
              --content-cache-control "public, max-age=31536000, immutable" \
              --auth-mode login \
              --no-progress \
              --only-show-errors --output none
          fi
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$STORAGE_CONTAINER" \
            --name index.html \
            --file "$RUNNER_TEMP/index.html" \
            --overwrite true \
            --content-cache-control "no-cache, no-store, must-revalidate" \
            --auth-mode login \
            --only-show-errors --output none
      - name: Verify static origin
        run: |
          base_url="https://${STORAGE_ACCOUNT}.blob.core.windows.net/${STORAGE_CONTAINER}"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            "${base_url}/index.html" | grep -Fq '<div id="root"></div>'
          asset_path="$(sed -n 's/.*src="\/\(assets\/[^"]*\.js\)".*/\1/p' "$RUNNER_TEMP/index.html" | head -1)"
          test -n "$asset_path"
          curl --fail --silent --show-error --head "${base_url}/${asset_path}" >/dev/null
      - name: Restore previous index
        if: ${{ failure() && steps.publish.outcome != 'skipped' }}
        run: |
          if [[ "$PREVIOUS_INDEX_EXISTS" == "true" ]]; then
            az storage blob upload \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$STORAGE_CONTAINER" \
              --name index.html \
              --file "$RUNNER_TEMP/previous-index.html" \
              --overwrite true \
              --content-cache-control "no-cache, no-store, must-revalidate" \
              --auth-mode login \
              --only-show-errors --output none
          else
            az storage blob delete \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$STORAGE_CONTAINER" \
              --name index.html \
              --auth-mode login \
              --only-show-errors --output none
          fi

  upload_sourcemaps:
    needs: deploy
    if: ${{ needs.deploy.outputs.sourcemaps != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      SOURCE_MAPS_IMAGE: ${{ needs.deploy.outputs.sourcemaps }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - name: Validate source-map artifact
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$SOURCE_MAPS_IMAGE" =~ ^alive\.azurecr\.io/alive/account-fe-sourcemaps@sha256:[0-9a-f]{64}$ ]] || exit 1
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload exact private source maps
        id: upload
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          [[ "$(az acr show -n alive --query anonymousPullEnabled -o tsv --only-show-errors)" == false ]] || exit 1
          az acr login --name alive
          docker pull "$SOURCE_MAPS_IMAGE"
          [[ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$SOURCE_MAPS_IMAGE")" == "$GITHUB_SHA" ]] || exit 1
          maps_dir="$(mktemp -d "$RUNNER_TEMP/account-fe-sourcemaps.XXXXXX")"
          container="$(docker create "$SOURCE_MAPS_IMAGE" /unused)"
          trap 'docker rm "$container" >/dev/null; rm -rf "$maps_dir"' EXIT
          docker cp "$container:/." "$maps_dir"
          corepack pnpm exec sentry-cli sourcemaps upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" --release "$GITHUB_SHA" "$maps_dir"
      - name: Report source-map publication
        if: always()
        run: |
          echo 'Source-map upload outcome: ${{ steps.upload.outcome }}. Retry this failed job only; the published site does not depend on it.' >> "$GITHUB_STEP_SUMMARY"
