name: Production Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-account-fe-production
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: account-fe-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan dependencies
        run: |
          trivy_cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$trivy_cache"
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$trivy_cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs /workspace/.git --skip-dirs /workspace/node_modules /workspace
      - run: |
          corepack pnpm test:run
          corepack pnpm lint
          corepack pnpm build
          ./scripts/test-release-policy.sh
          az bicep build --file infra/main.bicep --stdout >/dev/null

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      RESOURCE_GROUP: alive
      STORAGE_ACCOUNT: hhcaccountfeprod
      STORAGE_CONTAINER: site
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RELEASE_CONFIRMATION: ${{ github.event_name == 'push' && 'deploy-account-fe-production' || inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release configuration
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$RELEASE_CONFIRMATION" == "deploy-account-fe-production" ]]
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            test -n "${!name:-}" || { echo "Missing repository variable: ${name}" >&2; exit 1; }
          done
      - name: Sign in to Azure with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Preview static hosting infrastructure
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters provisionPermissions=false \
            --validation-level Provider \
            --result-format ResourceIdOnly \
            --only-show-errors
      - name: Provision static hosting
        run: |
          az deployment group create \
            --name "account-fe-static-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters provisionPermissions=false \
            --only-show-errors --output none
      - name: Build production site
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: corepack pnpm build
      - name: Capture current index
        run: |
          if az storage blob exists \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$STORAGE_CONTAINER" \
            --name index.html \
            --auth-mode login \
            --query exists -o tsv | grep -qx true; then
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$STORAGE_CONTAINER" \
              --name index.html \
              --file "$RUNNER_TEMP/previous-index.html" \
              --auth-mode login \
              --only-show-errors --output none
            echo "PREVIOUS_INDEX_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "PREVIOUS_INDEX_EXISTS=false" >> "$GITHUB_ENV"
          fi
      - name: Publish immutable assets then index
        id: publish
        run: |
          mv dist/index.html "$RUNNER_TEMP/index.html"
          az storage blob upload-batch \
            --account-name "$STORAGE_ACCOUNT" \
            --destination "$STORAGE_CONTAINER" \
            --source dist \
            --overwrite true \
            --content-cache-control "no-cache, no-store, must-revalidate" \
            --auth-mode login \
            --no-progress \
            --only-show-errors --output none
          if [[ -d dist/assets ]]; then
            az storage blob upload-batch \
              --account-name "$STORAGE_ACCOUNT" \
              --destination "$STORAGE_CONTAINER" \
              --destination-path assets \
              --source dist/assets \
              --overwrite true \
              --content-cache-control "public, max-age=31536000, immutable" \
              --auth-mode login \
              --no-progress \
              --only-show-errors --output none
          fi
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$STORAGE_CONTAINER" \
            --name index.html \
            --file "$RUNNER_TEMP/index.html" \
            --overwrite true \
            --content-cache-control "no-cache, no-store, must-revalidate" \
            --auth-mode login \
            --only-show-errors --output none
      - name: Verify static origin
        run: |
          base_url="https://${STORAGE_ACCOUNT}.blob.core.windows.net/${STORAGE_CONTAINER}"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            "${base_url}/index.html" | grep -Fq '<div id="root"></div>'
          asset_path="$(sed -n 's/.*src="\/\(assets\/[^"]*\.js\)".*/\1/p' "$RUNNER_TEMP/index.html" | head -1)"
          test -n "$asset_path"
          curl --fail --silent --show-error --head "${base_url}/${asset_path}" >/dev/null
      - name: Restore previous index
        if: ${{ failure() && steps.publish.outcome != 'skipped' }}
        run: |
          if [[ "$PREVIOUS_INDEX_EXISTS" == "true" ]]; then
            az storage blob upload \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$STORAGE_CONTAINER" \
              --name index.html \
              --file "$RUNNER_TEMP/previous-index.html" \
              --overwrite true \
              --content-cache-control "no-cache, no-store, must-revalidate" \
              --auth-mode login \
              --only-show-errors --output none
          else
            az storage blob delete \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$STORAGE_CONTAINER" \
              --name index.html \
              --auth-mode login \
              --only-show-errors --output none
          fi
