name: Production Release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-account-fe-production
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: account-fe-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          corepack pnpm test:run
          corepack pnpm lint
          corepack pnpm build
          ./scripts/test-release-policy.sh

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      ACR_NAME: alive
      ACR_LOGIN_SERVER: alive.azurecr.io
      IMAGE_REPOSITORY: alive/account-fe
      RESOURCE_GROUP: alive
      APP_NAME: account-fe
      API_GATEWAY_APP_NAME: api-gateway
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate release configuration
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$RELEASE_CONFIRMATION" == "deploy-account-fe-production" ]]
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            test -n "${!name:-}" || { echo "Missing repository variable: ${name}" >&2; exit 1; }
          done
      - name: Set image tag
        run: echo "IMAGE_TAG=main-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add --name containerapp --upgrade --yes
      - name: Capture rollback revision
        run: |
          resolve_image_ref() {
            local image="$1"
            if [[ "$image" == *@sha256:* ]]; then printf '%s\n' "$image"; return; fi
            local image_spec="${image#${ACR_LOGIN_SERVER}/}"
            local repository="${image_spec%:*}"
            local digest
            digest="$(az acr repository show --name "$ACR_NAME" --image "$image_spec" \
              --query digest -o tsv --only-show-errors)"
            [[ "$digest" == sha256:* ]]
            printf '%s/%s@%s\n' "$ACR_LOGIN_SERVER" "$repository" "$digest"
          }

          revision="$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" \
            --query properties.latestReadyRevisionName -o tsv --only-show-errors)"
          test -n "$revision"
          image="$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$APP_NAME" \
            --revision "$revision" \
            --query properties.template.containers[0].image -o tsv --only-show-errors)"
          test -n "$image"
          {
            echo "PREVIOUS_READY_REVISION=$revision"
            echo "PREVIOUS_IMAGE_REF=$(resolve_image_ref "$image")"
          } >> "$GITHUB_ENV"
      - name: Build and push image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          az acr login --name "$ACR_NAME"
          printf '@hallelujahhomechurch:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/npmrc"
          image_ref="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          docker build --secret id=npmrc,src="$RUNNER_TEMP/npmrc" -t "$image_ref" .
          docker push "$image_ref"
      - name: Resolve immutable image
        run: |
          digest="$(az acr repository show --name "$ACR_NAME" \
            --image "${IMAGE_REPOSITORY}:${IMAGE_TAG}" --query digest -o tsv --only-show-errors)"
          [[ "$digest" == sha256:* ]]
          echo "IMAGE_REF=${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_ENV"
      - name: Deploy
        id: deploy_runtime
        run: |
          az deployment group create \
            --name "account-fe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters image="$IMAGE_REF" provisionPermissions=false \
            --only-show-errors --output none
      - name: Wait for revision
        run: |
          for attempt in {1..60}; do
            latest="$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" --query properties.latestRevisionName -o tsv --only-show-errors)"
            ready="$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" --query properties.latestReadyRevisionName -o tsv --only-show-errors)"
            if [[ -n "$latest" && "$latest" == "$ready" ]]; then
              image="$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$APP_NAME" --revision "$ready" \
                --query properties.template.containers[0].image -o tsv --only-show-errors)"
              [[ "$image" == "$IMAGE_REF" ]] && exit 0
            fi
            sleep 10
          done
          echo "Account frontend did not become ready" >&2
          exit 1
      - name: Verify Dapr health through API gateway
        run: |
          output="$(timeout 60s script -q -e -c \
            "az containerapp exec -g \"$RESOURCE_GROUP\" -n \"$API_GATEWAY_APP_NAME\" --command \"/usr/bin/wget -S -O - http://localhost:3500/v1.0/invoke/account-fe/method/health\"" \
            /dev/null 2>&1)"
          output="${output//$'\r'/}"
          printf '%s\n' "$output"
          grep -Eq 'HTTP/1\.[01][[:space:]]+200' <<< "$output"
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"healthy"' <<< "$output"
          output="$(timeout 60s script -q -e -c \
            "az containerapp exec -g \"$RESOURCE_GROUP\" -n \"$API_GATEWAY_APP_NAME\" --command \"/usr/bin/wget -S -O - http://localhost:3500/v1.0/invoke/account-fe/method/login\"" \
            /dev/null 2>&1)"
          output="${output//$'\r'/}"
          printf '%s\n' "$output"
          grep -Eq 'HTTP/1\.[01][[:space:]]+200' <<< "$output"
          grep -Fq '<div id="root"></div>' <<< "$output"
      - name: Roll back failed runtime
        if: ${{ failure() && steps.deploy_runtime.outcome != 'skipped' }}
        run: |
          az containerapp revision copy \
            -g "$RESOURCE_GROUP" \
            -n "$APP_NAME" \
            --from-revision "$PREVIOUS_READY_REVISION" \
            --image "$PREVIOUS_IMAGE_REF" \
            --revision-suffix "rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --only-show-errors \
            --output none

          for attempt in {1..60}; do
            latest="$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" \
              --query properties.latestRevisionName -o tsv --only-show-errors)"
            ready="$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" \
              --query properties.latestReadyRevisionName -o tsv --only-show-errors)"
            if [[ -n "$latest" && "$latest" == "$ready" ]]; then
              image="$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$APP_NAME" \
                --revision "$ready" \
                --query properties.template.containers[0].image -o tsv --only-show-errors)"
              [[ "$image" == "$PREVIOUS_IMAGE_REF" ]] && exit 0
            fi
            sleep 10
          done
          echo "Account frontend rollback did not become ready" >&2
          exit 1
