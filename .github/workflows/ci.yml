name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: corepack pnpm test:run
      - run: corepack pnpm lint
      - run: corepack pnpm build
      - run: ./scripts/test-release-policy.sh
      - name: Build image
        run: |
          printf '@hallelujahhomechurch:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/npmrc"
          docker build --secret id=npmrc,src="$RUNNER_TEMP/npmrc" .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
